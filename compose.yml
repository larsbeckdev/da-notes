# Werte kommen aus der .env im selben Verzeichnis (siehe .env.example).
# Die Defaults nach ":-" greifen, wenn keine .env vorhanden ist.
#
# Zwei Betriebsarten:
#   docker compose --profile dev  up -d --build   Hot Reload zum Entwickeln
#   docker compose --profile prod up -d --build   Statisches Build fuer die Domain
services:
  backend:
    build: ./backend
    container_name: danotes-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Source bind mount for hot reload.
      - ./backend:/app
      # Named volume for the SQLite file, so it survives rebuilds and is not
      # shadowed by the bind mount above.
      - backend_data:/app/data
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY fehlt - .env.example nach .env kopieren}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,backend}
      DJANGO_DB_PATH: /app/data/db.sqlite3
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://da-notes.larsbeck.dev}
    # Apply migrations on every start, then serve.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  # Entwicklung: Angular-Dev-Server mit Hot Reload.
  frontend:
    profiles: ["dev"]
    build: ./frontend
    container_name: danotes-frontend
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    volumes:
      - ./frontend:/app
      # Anonymous volume keeps the image's node_modules from being hidden by
      # the bind mount above (host has no node_modules, or a Windows-built one).
      - /app/node_modules
    depends_on:
      - backend

  # Betrieb: kompiliertes Angular-Build, ausgeliefert von nginx. Dieser
  # Container proxyt /notes/ und /admin/ selbst an das Backend, deshalb muss
  # der vorgelagerte Server nur auf diesen einen Port weiterleiten.
  frontend-prod:
    profiles: ["prod"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: danotes-frontend-prod
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - backend

volumes:
  backend_data:

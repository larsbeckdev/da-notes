server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API und Admin an Django weiterreichen. Dadurch laufen Anwendung und API
    # unter demselben Origin und CORS entfällt.
    location /notes/ {
        proxy_pass http://backend:8000/notes/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_set_header Host $host;
    }

    # Angular-Routing: unbekannte Pfade an index.html, damit Deep Links
    # nicht in einem 404 landen.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
